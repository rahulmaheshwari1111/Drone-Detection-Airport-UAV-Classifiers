version: "3.9"
services:
  db:
    image: postgres:16
    container_name: airport-uav-db
    environment:
      POSTGRES_DB: airport_uav
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: airport-uav-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./app:/app/app
      - ./artifacts:/app/artifacts
      - ./docs:/app/docs

volumes:
  postgres_data:
